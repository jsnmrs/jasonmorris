name: Links

# Refresh the /links/ feed from Raindrop.io.
#
# main is a protected branch, so the refreshed snapshot arrives as a pull
# request rather than a direct push. Merging it is an ordinary push to main,
# which triggers Deploy on its own.

on:
  schedule:
    # 10:00 UTC — 6am EDT, 5am EST. Cron does not follow daylight saving.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: links
  cancel-in-progress: false

jobs:
  links:
    name: Refresh links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Fetch links from Raindrop
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_COLLECTION_ID: "73988867"
        run: node scripts/fetch-links.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update links from Raindrop
          title: "Update links from Raindrop"
          body: |
            Automated refresh of `_data/links.json` from the Raindrop.io collection.

            The diff is the links added, removed, or retitled since the last refresh.
          branch: update-links
          delete-branch: true
          base: main
          add-paths: _data/links.json
