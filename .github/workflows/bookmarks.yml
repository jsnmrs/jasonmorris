name: Bookmarks

# Refresh the /bookmarks/ feed from Raindrop.io.
#
# Commits made with GITHUB_TOKEN do not trigger other workflows, so this job
# dispatches "Deploy" explicitly rather than relying on the push to main.

on:
  schedule:
    # 10:00 UTC — 6am EDT, 5am EST. Cron does not follow daylight saving.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bookmarks
  cancel-in-progress: false

jobs:
  bookmarks:
    name: Refresh bookmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Fetch bookmarks from Raindrop
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_COLLECTION_ID: "73988867"
        run: node scripts/fetch-bookmarks.js

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- _data/bookmarks.json; then
            echo "No bookmark changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/bookmarks.json
          git commit -m "Update bookmarks from Raindrop"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
