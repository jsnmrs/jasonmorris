name: Bookmarks

# Refresh the /bookmarks/ feed from Raindrop.io.
#
# main is a protected branch, so the refreshed snapshot arrives as a pull
# request rather than a direct push. Merging it is an ordinary push to main,
# which triggers Deploy on its own.

on:
  schedule:
    # 10:00 UTC — 6am EDT, 5am EST. Cron does not follow daylight saving.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bookmarks
  cancel-in-progress: false

jobs:
  bookmarks:
    name: Refresh bookmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Fetch bookmarks from Raindrop
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          RAINDROP_COLLECTION_ID: "73988867"
        run: node scripts/fetch-bookmarks.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update bookmarks from Raindrop
          title: "Update bookmarks from Raindrop"
          body: |
            Automated refresh of `_data/bookmarks.json` from the Raindrop.io collection.

            The diff is the bookmarks added, removed, or retitled since the last refresh.
          branch: update-bookmarks
          delete-branch: true
          base: main
          add-paths: _data/bookmarks.json
